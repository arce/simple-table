<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimpleTable – Example</title>
  <link rel="stylesheet" href="../simple-table.css">
  <link rel="stylesheet" href="../simple-details.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 600;
    }

    p.subtitle {
      margin: 0 0 20px;
      color: #666;
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .toolbar button {
      padding: 6px 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .toolbar button:hover { background: #f0f0f0; }
    .toolbar button:disabled { opacity: 0.4; cursor: default; }

    .toolbar button.primary {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }

    .toolbar button.primary:hover { background: #1558b0; }

    #selection-info {
      margin-left: auto;
      font-size: 13px;
      color: #555;
    }

    #table-container {
      height: 460px;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <h1>SimpleTable</h1>
  <p class="subtitle">
    Employee data example. Sort by column, filter, resize columns, select rows (Ctrl/Shift+click), and click "View detail" to inspect a row.
  </p>

  <div class="toolbar">
    <button class="primary" id="btn-detail" disabled>View detail</button>
    <button id="btn-clear">Clear selection</button>
    <span id="selection-info">No row selected</span>
  </div>

  <div id="table-container"></div>

  <script src="../simple-table.js"></script>
  <script src="../simple-details.js"></script>
  <script>
    const employees = [
      { id: 1,  name: 'Ana Garcia',       department: 'Engineering',  role: 'Lead Engineer',      salary: 95000, age: 34, start_year: 2018 },
      { id: 2,  name: 'Carlos Mendoza',  department: 'Product',      role: 'Product Manager',    salary: 88000, age: 41, start_year: 2015 },
      { id: 3,  name: 'Laura Perez',     department: 'Design',       role: 'UX Designer',        salary: 72000, age: 29, start_year: 2021 },
      { id: 4,  name: 'Miguel Torres',   department: 'Engineering',  role: 'Backend Developer',  salary: 82000, age: 27, start_year: 2022 },
      { id: 5,  name: 'Sofia Ramirez',   department: 'Marketing',    role: 'Growth Lead',        salary: 78000, age: 33, start_year: 2019 },
      { id: 6,  name: 'Diego Herrera',   department: 'Finance',      role: 'Financial Analyst',  salary: 69000, age: 30, start_year: 2020 },
      { id: 7,  name: 'Val Lopez',       department: 'Engineering',  role: 'Frontend Developer', salary: 80000, age: 26, start_year: 2023 },
      { id: 8,  name: 'Andres Castillo', department: 'Sales',        role: 'Account Executive',  salary: 64000, age: 38, start_year: 2017 },
      { id: 9,  name: 'Camila Vega',     department: 'HR',           role: 'HR Manager',         salary: 71000, age: 44, start_year: 2013 },
      { id: 10, name: 'Sebastian Rojas', department: 'Engineering',  role: 'DevOps Engineer',    salary: 90000, age: 31, start_year: 2019 },
      { id: 11, name: 'Isabel Morales',  department: 'Product',      role: 'Product Designer',   salary: 75000, age: 28, start_year: 2022 },
      { id: 12, name: 'Tomas Navarro',   department: 'Sales',        role: 'Sales Manager',      salary: 85000, age: 46, start_year: 2011 },
      { id: 13, name: 'Lucia Fernandez', department: 'Marketing',    role: 'Content Strategist', salary: 62000, age: 25, start_year: 2024 },
      { id: 14, name: 'Mateo Jimenez',   department: 'Engineering',  role: 'Data Engineer',      salary: 92000, age: 35, start_year: 2017 },
      { id: 15, name: 'Renata Guzman',   department: 'Design',       role: 'Visual Designer',    salary: 67000, age: 27, start_year: 2023 },
      { id: 16, name: 'Felipe Romero',   department: 'Finance',      role: 'CFO',                salary: 130000, age: 52, start_year: 2009 },
      { id: 17, name: 'Natalia Vargas',  department: 'HR',           role: 'Recruiter',          salary: 58000, age: 24, start_year: 2025 },
      { id: 18, name: 'Pablo Aguilar',   department: 'Engineering',  role: 'QA Engineer',        salary: 74000, age: 29, start_year: 2021 },
      { id: 19, name: 'Daniela Reyes',   department: 'Product',      role: 'Business Analyst',   salary: 79000, age: 36, start_year: 2016 },
      { id: 20, name: 'Rodrigo Silva',   department: 'Engineering',  role: 'CTO',                salary: 145000, age: 48, start_year: 2008 },
    ];

    const columns = [
      { field: 'id',          title: 'ID',             type: 'number', width: '5%' },
      { field: 'name',        title: 'Name',                           width: '20%' },
      { field: 'department',  title: 'Department',                     width: '16%' },
      { field: 'role',        title: 'Role',                           width: '20%' },
      { field: 'salary',      title: 'Salary (USD)',   type: 'number', width: '15%' },
      { field: 'age',         title: 'Age',            type: 'number', width: '8%' },
      { field: 'start_year',  title: 'Start Year',     type: 'number', width: '12%' },
    ];

    // Detail panel
    const detail = new SimpleDetail({ title: 'Employee detail' });

    // State
    let selectedRows = [];

    // Table
    const table = new SimpleTable('table-container', {
      data: employees,
      columns: columns,
      selectable: true,
      height: '460px',
      pageSize: 8,
      onRowSelect: (rows) => {
        selectedRows = rows;
        const btnDetail = document.getElementById('btn-detail');
        const info = document.getElementById('selection-info');

        btnDetail.disabled = rows.length === 0;
        if (rows.length === 0) {
          info.textContent = 'No row selected';
        } else if (rows.length === 1) {
          info.textContent = `1 row selected: ${rows[0].name}`;
        } else {
          info.textContent = `${rows.length} rows selected`;
        }
      }
    });

    // Show detail of first selected row on button click
    document.getElementById('btn-detail').addEventListener('click', () => {
      if (selectedRows.length > 0) detail.show(selectedRows[0], columns);
    });

    // Clear selection
    document.getElementById('btn-clear').addEventListener('click', () => {
      table.selectedRows.clear();
      table.lastSelected = null;
      table.render();
      selectedRows = [];
      document.getElementById('btn-detail').disabled = true;
      document.getElementById('selection-info').textContent = 'No row selected';
    });
  </script>
</body>
</html>
